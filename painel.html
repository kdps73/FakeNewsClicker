<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./fakeNews.css">
    <title>Painel - Fake News Clicker</title>
</head>

<body>
    <!-- NAVBAR (idêntica ao fakeNews.html) -->
    <div class="nav">
        <div class="nav-link-esquerda">
            <a href="./fakeNews.html">🎮 Jogo</a>
        </div>
        <div class="nav-centro">
            <h1>🔥 Fake News Clicker 🔥</h1>
            <span class="nav-subtitulo">O mundo está sem caos algum, você é o agente do CAOS</span>
        </div>
    </div>

    <!-- CARD LOGIN -->
    <div class="card card-login" id="autenticarForm" style="display: block;">
        <div class="card-titulo">
            <h2>🔑 Login</h2>
        </div>
        <div class="card-conteudo">
            <form>
                <p>Digite seu usuário:</p>
                <input id="inputUser" />
                <p style="margin-top: 14px;">Digite sua senha:</p>
                <input type="password" id="inputSenha" />
            </form>
            <button onclick="autenticar()">Entrar</button>
        </div>
    </div>

    <!-- PAINEL ADMIN -->
    <div class="painel-admin" id="painel" style="display: none;">
        <h1>Painel administrativo</h1>
        <p>Você está logado como <strong>administrador</strong>.</p>
        <button onclick="logout()">Sair da conta</button>
    </div>

    <script>
        verificaLogin()

        function verificaLogin() {
            let autenticado = localStorage.getItem("autenticado")
            if (autenticado == 1) {
                document.getElementById("painel").style.display = "block"
                document.getElementById("autenticarForm").style.display = "none"
            }
        }


        function autenticar() {
            let user = document.getElementById("inputUser").value
            let senha = document.getElementById("inputSenha").value

            if (user != "admin") {
                alert("Usuário incorreto")
                document.getElementById("inputUser").value = ""
                document.getElementById("inputSenha").value = ""
                return
            }

            if (senha != "123123") {
                alert("Senha incorreta")
                document.getElementById("inputUser").value = ""
                document.getElementById("inputSenha").value = ""
                return
            }

            if (user.trim().length < 3) {
                alert("Usuário incorreto. Verifique e tente novamente...")
                return
            }

            if (senha.length == 0) {
                alert("Senha incorreta. Verifique e tente novamente...")
                return
            }

            localStorage.setItem("autenticado", 1)
            document.getElementById("painel").style.display = "block"
            document.getElementById("autenticarForm").style.display = "none"

        }

        function logout() {
            localStorage.removeItem("autenticado")
            document.getElementById("painel").style.display = "none"
            document.getElementById("autenticarForm").style.display = "block"
            document.getElementById("inputUser").value = ""
            document.getElementById("inputSenha").value = ""
        }
    </script>
</body>

</html>
